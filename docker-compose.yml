version: '3.8'

services:
  fastapi:
    build: .
    working_dir: /app/app
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env

  chainlit:
    build: .
    working_dir: /app
    command: chainlit run app/main.py --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - FASTAPI_URL=http://fastapi:8000
    depends_on:
      - fastapi
